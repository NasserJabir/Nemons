name: CI - Tests

# v4.2.1-fix (revision 2): tightened the verification gate.
#
# Changes from revision 1:
#   - All `continue-on-error: true` removed — the gate now fails
#     loudly on any issue instead of silently swallowing it.
#   - Security audit split into TWO jobs with explicit policy:
#       1. security-advisory: npm audit (informational only, but
#          still surfaces vulnerabilities in the GitHub Security tab)
#       2. security-blocking: secret-scan + a strict audit at
#          `moderate` threshold. This job MUST pass for the gate
#          to be green, so it blocks any release that has known
#          moderate-or-higher vulnerabilities OR hardcoded secrets.
#   - Legacy unit tests: now run WITHOUT continue-on-error. The two
#      pre-existing failures (HCoT stack overflow, DAG node_count
#      mismatch) have been FIXED at the source — they were real bugs,
#      not flaky tests. See the commit log for the fixes.
#   - TS Core tests now also run `npx tsc --noEmit` separately from
#      the build, so type errors are reported in their own check.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# v4.2.1-fix: release-policy gate. When a release manager pushes a
# tag matching v*, OR sets NEMONS_RELEASE_POLICY=strict in the
# workflow_dispatch input, the `security-blocking` job becomes a
# hard requirement (it already always is — but this env var makes
# the policy visible in the run logs).
env:
  NEMONS_RELEASE_POLICY: ${{ startsWith(github.ref, 'refs/tags/v') && 'strict' || 'advisory' }}
  # v4.2.1-fix (rev 3): set NEMONS_HOME + NEMONS_PORT at the workflow
  # level so ALL steps in test-daemon use the same isolated home and
  # the same port. Previously each step set NEMONS_HOME inline, but
  # the stop step FORGOT to — so it looked in ~/.nemos/run/daemon.pid
  # instead of /tmp/nemos-ci-smoke/run/daemon.pid and reported
  # "Daemon not running (no PID file)" while the port was still
  # bound. This caused the smoke test to fail.
  NEMONS_HOME: /tmp/nemos-ci-smoke
  NEMONS_PORT: "3456"

jobs:
  test-daemon:
    name: Daemon Tests (Node ${{ matrix.node-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [18, 20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install daemon dependencies
        working-directory: ./nemos
        run: npm install --production

      - name: Syntax check all daemon source files (cross-platform)
        working-directory: ./nemos
        run: node scripts/lint.js

      - name: Run legacy unit tests (35 tests, no exceptions)
        working-directory: ./nemos
        run: node tests/unit-tests.js
        # v4.2.1-fix: continue-on-error removed. The two pre-existing
        # failures (HCoT stack overflow, DAG node_count mismatch) were
        # real bugs in the source — they have been fixed. If new failures
        # appear here, the gate MUST block until they're root-caused.

      - name: Run v4.2.1 persona-driven pipeline tests (33 tests)
        working-directory: ./nemos
        run: node tests/v421-persona-tests.js

      - name: Run v4.2.1 @nemons/core bridge integration tests (22 tests)
        working-directory: ./nemos
        run: node tests/v421-bridge-tests.js

      - name: Run security tests (path containment, auth, rate limit)
        working-directory: ./nemos
        run: node tests/security-tests.js
        # Release-blocking: these tests exist because real vulnerabilities
        # existed (traversal write via /evidence, traversal read via
        # /context-pack, unvalidated ids in kanban/a2a filenames,
        # timing-leaky token compare, unwired rate limiter). A failure
        # here means a vulnerability is back.

      - name: Run e2e suite (run-all — spawns a real daemon)
        working-directory: ./nemos
        run: npm test
        # This suite was NOT in CI before, which is why the /evaluate
        # `pass` vs `passed` field drift shipped undetected. It starts
        # and stops its own daemon on an isolated NEMONS_HOME.

      - name: Smoke test — start daemon
        working-directory: ./nemos
        run: node bin/nemons.js daemon start
        # v4.2.1-fix (rev 3): NEMONS_HOME and NEMONS_PORT are now set
        # at the workflow level so the stop step (which previously
        # forgot to set them inline) reads the same values.

      - name: Smoke test — verify /health and /core/status
        working-directory: ./nemos
        run: |
          set -e
          echo "--- /health ---"
          curl -sf http://127.0.0.1:${NEMONS_PORT}/health | jq -e '.status == "healthy" and .core_loaded == true'
          echo "--- /core/status ---"
          curl -sf http://127.0.0.1:${NEMONS_PORT}/core/status | jq -e '.bridge_loaded == true and (.available_apis | length) >= 17'
          echo "--- /core/sha256 ---"
          HASH=$(curl -sf "http://127.0.0.1:${NEMONS_PORT}/core/sha256?s=hello" | jq -r .hash)
          [ "$HASH" = "2cf24dba5fb0a30e26e83b2ac5b9e29e1b161e5c1fa7425e73043362938b9824" ]

      - name: Smoke test — run `nemons verify` against the live daemon
        working-directory: ./nemos
        run: node bin/nemons.js verify
        # verify now honors NEMONS_PORT, so it targets this daemon.
        # This was previously absent from CI and its Test 7 was broken.

      - name: Smoke test — stop daemon and verify it died
        working-directory: ./nemos
        run: |
          set -e
          # v4.2.1-fix: `daemon stop` now exits non-zero if the process
          # can't be killed, so this is a real check.
          node bin/nemons.js daemon stop
          # Verify the port is free (no leftover listener)
          if ss -tln 2>/dev/null | grep -q ":${NEMONS_PORT}"; then
            echo "ERROR: port ${NEMONS_PORT} still bound after daemon stop"
            exit 1
          fi
          # Macos doesn't have `ss` — fall back to nc
          if command -v nc >/dev/null && nc -z 127.0.0.1 ${NEMONS_PORT} </dev/null 2>/dev/null; then
            echo "ERROR: port ${NEMONS_PORT} still accepting connections after daemon stop"
            exit 1
          fi
          echo "✓ daemon stopped, port ${NEMONS_PORT} verified free"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-logs-${{ matrix.os }}-node${{ matrix.node-version }}
          path: ~/.nemons/logs/
          retention-days: 7

  test-daemon-windows:
    name: Daemon Tests (Windows, Node 22)
    runs-on: windows-latest
    # The installers claim Windows 10/11 support, but nothing in CI
    # ran on Windows — the old bash lint loop failed there. This job
    # covers lint + the four in-process suites. The daemon
    # spawn/stop e2e suites (run-all, smoke) stay on the unix matrix
    # until their SIGTERM-based process lifecycle is hardened for
    # Windows semantics.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install daemon dependencies
        working-directory: ./nemos
        run: npm install --production

      - name: Syntax check all daemon source files
        working-directory: ./nemos
        run: node scripts/lint.js

      - name: Run legacy unit tests
        working-directory: ./nemos
        run: node tests/unit-tests.js

      - name: Run v4.2.1 persona-driven pipeline tests
        working-directory: ./nemos
        run: node tests/v421-persona-tests.js

      - name: Run v4.2.1 @nemons/core bridge integration tests
        working-directory: ./nemos
        run: node tests/v421-bridge-tests.js

      - name: Run security tests
        working-directory: ./nemos
        run: node tests/security-tests.js

  test-core:
    name: TS Core Tests (TypeScript @nemons/core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install TS core dependencies
        working-directory: ./nemos-core
        run: npm install

      - name: TypeScript typecheck (strict mode, separate from build)
        working-directory: ./nemos-core
        run: npx tsc --noEmit

      - name: Build TS core (production output)
        working-directory: ./nemos-core
        run: npm run build

      - name: Run vitest suite (1215 tests, no exceptions)
        working-directory: ./nemos-core
        run: npm test

      - name: Guard — committed dist/ is fresh (no drift vs a clean build)
        working-directory: ./nemos-core
        run: |
          # nemos-core/dist/ is intentionally tracked (see .gitignore for
          # the decision record) so plugin users can run the daemon
          # without a build step. This guard makes staleness impossible:
          # if a source change wasn't accompanied by a rebuild+commit,
          # the diff below fails the gate.
          npm run build
          cd ..
          git diff --exit-code -- nemos-core/dist/ || {
            echo "❌ nemos-core/dist/ is STALE — rebuild (`cd nemos-core && npm run build`) and commit the result."
            exit 1
          }
          echo "✓ committed dist matches a clean build"

      - name: Consumer smoke test — npm pack → install → import
        working-directory: ./nemos-core
        run: |
          # Proves the package is consumable the way a real consumer
          # would use it: the exports map, types entry and files list
          # are all exercised. Before this, package.json had no
          # main/exports/types — Node could not resolve @nemons/core.
          # NOTE: the tarball name is resolved via ls, NOT a quoted
          # glob — "$.../nemons-core-*.tgz" suppresses shell expansion
          # and npm receives a literal `*` (this exact bug failed CI).
          npm pack >/dev/null
          TARBALL=$(ls nemons-core-*.tgz | head -1)
          echo "tarball: $TARBALL"
          CONSUMER_DIR=$(mktemp -d)
          cd "$CONSUMER_DIR"
          echo '{"name":"consumer-smoke","private":true}' > package.json
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/nemos-core/$TARBALL"
          node -e "
          import('@nemons/core').then(m => {
            const k = Object.keys(m);
            if (!k.includes('DefaultGovernedEvolutionEngine')) throw new Error('missing engine export');
            if (k.length < 100) throw new Error('suspiciously few exports: ' + k.length);
            console.log('consumer import OK —', k.length, 'exports');
          }).catch(e => { console.error(e.message); process.exit(1); });
          "

      - name: Verify built dist/ loads via the daemon bridge
        working-directory: ./nemos
        run: |
          node -e "
          const bridge = require('./src/utils/nemos-bridge');
          bridge.loadCore().then(ns => {
            console.log('bridge loaded:', bridge.corePath());
            console.log('exports count:', Object.keys(ns).length);
            if (!ns.buildPersistentRuntime) throw new Error('missing buildPersistentRuntime');
            if (!ns.DefaultGovernedEvolutionEngine) throw new Error('missing GovernedEvolutionEngine');
            console.log('OK');
          }).catch(e => { console.error(e.message); process.exit(1); });
          "

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install daemon dependencies
        working-directory: ./nemos
        run: npm install

      - name: Syntax check all JS files (cross-platform)
        working-directory: ./nemos
        run: node scripts/lint.js

      - name: Verify all package.json files are valid JSON
        run: |
          set -e
          jq empty nemos/package.json
          jq empty nemos-core/package.json
          jq empty package.json
          echo "All package.json files are valid JSON"

  security-advisory:
    name: Security Advisory (npm audit, informational)
    runs-on: ubuntu-latest
    # v4.2.1-fix: this job is informational only — it surfaces
    # vulnerabilities in the GitHub Security tab but does NOT
    # block the gate. The blocking variant is in `security-blocking`.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install daemon dependencies (with dev)
        working-directory: ./nemos
        run: npm install

      - name: npm audit (advisory — all severities, including dev)
        working-directory: ./nemos
        run: npm audit --audit-level=low || true
        # Always succeeds — the goal is to surface the audit JSON
        # in the GitHub Actions log and the Security tab, not to fail.

      - name: npm audit (TS core)
        working-directory: ./nemos-core
        run: npm audit --audit-level=low || true

  security-blocking:
    name: Security Gate (release-blocking)
    runs-on: ubuntu-latest
    # v4.2.1-fix: this job has NO continue-on-error. It blocks the
    # gate if EITHER (a) a hardcoded secret is found in source, OR
    # (b) there's a moderate-or-higher vulnerability in production
    # dependencies. This is the strict release policy.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install daemon dependencies (production only)
        working-directory: ./nemos
        run: npm install --production

      - name: Strict npm audit — moderate or higher (release-blocking)
        working-directory: ./nemos
        run: npm audit --omit=dev --audit-level=moderate
        # v4.2.1-fix: no continue-on-error. A moderate-or-higher
        # vulnerability in production dependencies MUST block the
        # release. The release manager is responsible for either
        # (a) upgrading the affected package, or
        # (b) opening a tracked exception with an explicit risk
        #     acceptance that gets reviewed by a human.

      - name: Hardcoded secret scan (release-blocking)
        run: |
          set -e
          # Look for common secret patterns. Excludes:
          #   - node_modules/, .git/, dist/
          #   - *.md (documentation may mention example secrets)
          #   - **/tests/**, **/build-scripts/** (test fixtures that
          #     intentionally exercise the secret detector with
          #     synthetic strings like "sk-abc123def456...")
          #   - *_test.{ts,js}, *.test.{ts,js} (jest-style test files)
          #   - *.tar.gz, *.zip (binary archives)
          if grep -rE "(sk-ant-[a-zA-Z0-9]{20,}|sk-[a-zA-Z0-9]{20,}|AKIA[A-Z0-9]{16}|github_pat_[a-zA-Z0-9]{20,})" \
              --exclude-dir=node_modules \
              --exclude-dir=.git \
              --exclude-dir=dist \
              --exclude-dir=tests \
              --exclude-dir=build-scripts \
              --exclude="*.md" \
              --exclude="*.tar.gz" \
              --exclude="*.zip" \
              --exclude="*_test.ts" \
              --exclude="*_test.js" \
              --exclude="*.test.ts" \
              --exclude="*.test.js" \
              . ; then
            echo "❌ Found hardcoded secrets in source — release BLOCKED"
            exit 1
          else
            echo "✅ No hardcoded secrets found"
          fi

      - name: Surface release policy
        run: |
          echo "Release policy: $NEMONS_RELEASE_POLICY"
          if [ "$NEMONS_RELEASE_POLICY" = "strict" ]; then
            echo "→ This run is enforcing strict release policy (triggered by a v* tag)."
            echo "→ Any failure in this job BLOCKS the release."
          else
            echo "→ This run is in advisory mode (not triggered by a release tag)."
            echo "→ This job still blocks the gate — the env var only affects logging."
          fi
