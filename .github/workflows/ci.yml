name: CI - Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Run Tests (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [18, 20, 22]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: 📦 Install dependencies
        working-directory: ./nemons
        run: npm install --production
      
      - name: 🚀 Start daemon
        working-directory: ./nemons
        run: |
          node bin/nemons.js daemon start &
          sleep 3
      
      - name: 🧪 Run tests
        working-directory: ./nemons
        run: node bin/nemons.js verify
      
      - name: 🛑 Stop daemon
        if: always()
        working-directory: ./nemons
        run: node bin/nemons.js daemon stop || true
      
      - name: 📊 Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nemons-logs-${{ matrix.os }}-node${{ matrix.node-version }}
          path: ~/.nemons/logs/
          retention-days: 7

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: 📦 Install dependencies
        working-directory: ./nemons
        run: npm install
      
      - name: 🔍 Basic syntax check
        working-directory: ./nemons
        run: |
          for f in $(find src -name "*.js"); do
            node --check "$f" || exit 1
          done
          node --check bin/nemons.js

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: 📦 Install dependencies
        working-directory: ./nemons
        run: npm install --production
      
      - name: 🔒 Run npm audit
        working-directory: ./nemons
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      
      - name: 🕵️ Check for secrets in source
        run: |
          # Simple grep for common secrets
          if grep -rE "(sk-ant-[a-zA-Z0-9]{20,}|sk-[a-zA-Z0-9]{20,}|AKIA[A-Z0-9]{16})" \
              --exclude-dir=node_modules \
              --exclude-dir=.git \
              --exclude="*.md" \
              . ; then
            echo "❌ Found hardcoded secrets!"
            exit 1
          else
            echo "✅ No hardcoded secrets found"
          fi
